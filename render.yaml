databases:
  - name: artemis-db
    plan: free
    databaseName: artemis
    user: artemis
    postgresMajorVersion: "16"

services:
  # ── API (Node.js Web Service) ──────────────────────────────────────
  - type: web
    name: artemis-api
    runtime: node
    plan: free
    buildCommand: >-
      sed -i 's/provider = "sqlite"/provider = "postgresql"/' apps/api/prisma/schema.prisma &&
      npm ci &&
      npm run build --workspace=apps/api
    startCommand: >-
      cd apps/api &&
      npx prisma db push --skip-generate &&
      node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: artemis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        value: https://artemis-web.onrender.com
      - key: APP_URL
        value: https://artemis-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # ── Web (React Static Site) ────────────────────────────────────────
  - type: web
    name: artemis-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://artemis-api.onrender.com/api/v1
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
